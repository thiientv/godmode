name: Release Godmode

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate repository
        run: npm run check

      - name: Verify tag matches package and manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          paths = [
              Path("package.json"),
              Path(".claude-plugin/plugin.json"),
              Path(".codex-plugin/plugin.json"),
              Path("skills/.codex-plugin/plugin.json"),
          ]
          versions = {str(path): json.loads(path.read_text())["version"] for path in paths}
          mismatches = {path: version for path, version in versions.items() if version != expected}
          if mismatches:
              raise SystemExit(f"Version mismatch for {expected}: {mismatches}")
          PY

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="godmode-${RELEASE_TAG}.tar.gz"
          git archive --format=tar.gz \
            --prefix="godmode-${RELEASE_TAG}/" \
            --output="$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"

      - name: Smoke test built release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_smoke.py "godmode-${RELEASE_TAG}.tar.gz"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godmode-release
          path: |
            godmode-${{ github.ref_name }}.tar.gz
            godmode-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: godmode-release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "godmode-${RELEASE_TAG}.tar.gz" \
            "godmode-${RELEASE_TAG}.tar.gz.sha256" \
            --generate-notes \
            --title "Godmode ${RELEASE_TAG}"
